<!doctype html><html lang=en><head><meta charset=UTF-8><link rel=icon type=image/x-icon href=../client/images/favicon.ico><title>Browser Multiplayer (Single HTML)</title><style>body{font-family:sans-serif;padding:20px}#clients{margin-top:20px}</style><script src=../@World/World.js defer></script><script src=../@WorldClient/WorldClient.js defer></script></head><body>
		<div id=work></div>
		

		<script>const channel=new BroadcastChannel("game_channel");function serverWork(){document.getElementById("work").appendChild(globalThis["@World"].Utility.JSONtoHTML([{type:"h1",children:"Browser Multiplayer Server"},{type:"button",props:{id:"addClient"},children:"Add Client"},{type:"div",children:[{type:"h2",children:"Connected Clients:"},{type:"ul",props:{id:"clientList"}}]}]));const e=document.getElementById("clientList"),t={};channel.onmessage=n=>{const{type:l,clientId:o,payload:d}=n.data;if("join"===l){if(!t[o]){t[o]=!0;const n=document.createElement("li");n.id="client-"+o,n.textContent=`Client ${o} joined`,e.appendChild(n)}}else if("leave"===l){delete t[o];const e=document.getElementById("client-"+o);e&&e.remove(),console.log(`Client ${o} left`)}else"message"===l&&(console.log(`Client ${o} says:`,d),channel.postMessage({type:"broadcast",payload:`Server received: ${d}`}))},document.getElementById("addClient").addEventListener("click",()=>{window.open(location.href+"#client","_blank","width=400,height=400")})}function clientWork(){const e=Math.floor(1e4*Math.random()),t=[{type:"h1",children:"Client"},{type:"div",props:{id:"status"},children:`Client ID: ${e}`},{type:"button",props:{id:"sendMessage"},children:"Send Random Message"}];document.getElementById("work").appendChild(globalThis["@World"].Utility.JSONtoHTML(t));const n=document.getElementById("status");channel.postMessage({type:"join",clientId:e}),document.getElementById("sendMessage").addEventListener("click",()=>{const t="Hello "+Math.floor(1e3*Math.random());channel.postMessage({type:"message",clientId:e,payload:t})}),window.addEventListener("beforeunload",()=>{channel.postMessage({type:"leave",clientId:e})}),channel.onmessage=t=>{const{type:l,payload:o}=t.data;"broadcast"===l&&(n.textContent=`Client ${e} received: ${o}`)}}document.body.onload=()=>{"#client"===window.location.hash?clientWork():serverWork()};</script>
	

</body></html>
